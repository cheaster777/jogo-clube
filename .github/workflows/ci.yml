name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:ci-password@localhost:5432/jogo_clube_test
      TEST_DATABASE_URL: postgresql://postgres:ci-password@localhost:5432/jogo_clube_test
      VITE_API_BASE_URL: /api/v1

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: jogo_clube_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jogo_clube_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Typecheck do backend
        run: npm run server:build

      - name: Build do frontend
        run: npm run build

      - name: Instalar navegador E2E
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E do frontend
        run: npm run test:e2e

      - name: Aplicar migrações no PostgreSQL de CI
        run: npm run db:migrate

      - name: Testes da aplicação
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "Nenhum script de testes configurado; os testes entram na Fase 1 do PRD."
          fi

      - name: Smoke de backup criptografado e restore
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age postgresql-client
          key_file="$RUNNER_TEMP/jogo-clube-age-key"
          dump_file="$RUNNER_TEMP/jogo-clube-ci.dump.age"
          age-keygen -o "$key_file" >/dev/null
          recipient="$(grep -o 'age1[[:alnum:]]*' "$key_file" | head -n 1)"
          test -n "$recipient"
          pg_dump --format=custom --no-owner "$DATABASE_URL" \
            | age -r "$recipient" -o "$dump_file"
          sha256sum "$dump_file" > "$dump_file.sha256"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE jogo_clube_restore'
          restore_url='postgresql://postgres:ci-password@localhost:5432/jogo_clube_restore'
          BACKUP_FILE="$dump_file" \
          AGE_KEY_FILE="$key_file" \
          RESTORE_DATABASE_URL="$restore_url" \
            bash scripts/restore-postgres.sh
          restored_tables="$(psql "$restore_url" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")"
          test "$restored_tables" -ge 9

      - name: Verificar migrações
        run: |
          node scripts/verify-migrations.mjs
          node --check scripts/import-supabase-users.mjs

      - name: Auditar dependências de runtime
        run: npm audit --omit=dev --audit-level=high

      - name: Auditar ferramentas de build e mobile
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validar configuração do Compose
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose config --quiet

      - name: Build da imagem estática
        run: docker build --target frontend --tag jogo-clube-frontend:ci .

      - name: Build da imagem da API
        run: docker build --target api --tag jogo-clube-api:ci .

  deploy-production:
    name: Deploy na VPS
    needs: quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: jogo-clube-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://jogo.tonicoimbra.com' }}

    steps:
      - name: Checkout da release validada
        uses: actions/checkout@v4

      - name: Validar configuração de produção
        shell: bash
        run: |
          set -euo pipefail
          for variable in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!variable}" ]]; then
              echo "Secret obrigatório ausente no environment production: $variable" >&2
              exit 1
            fi
          done
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$PRODUCTION_BASE_URL" == https://* ]]

      - name: Preparar SSH com host key fixada
        shell: bash
        run: |
          set -euo pipefail
          ssh_key_path="$RUNNER_TEMP/jogo-clube-vps-key"
          known_hosts_path="$RUNNER_TEMP/jogo-clube-known-hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_key_path"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts_path"
          chmod 600 "$ssh_key_path" "$known_hosts_path"
          ssh-keygen -y -f "$ssh_key_path" >/dev/null
          test -s "$known_hosts_path"

      - name: Empacotar commit imutável
        shell: bash
        run: |
          set -euo pipefail
          release_archive="$RUNNER_TEMP/jogo-clube-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz --output="$release_archive" "$GITHUB_SHA"
          sha256sum "$release_archive"

      - name: Enviar release para a VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh_key_path="$RUNNER_TEMP/jogo-clube-vps-key"
          known_hosts_path="$RUNNER_TEMP/jogo-clube-known-hosts"
          release_archive="$RUNNER_TEMP/jogo-clube-$GITHUB_SHA.tar.gz"
          ssh_options=(
            -i "$ssh_key_path"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_path"
          )
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "mkdir -p 'jogo-clube-releases'"
          scp \
            -i "$ssh_key_path" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_path" \
            "$release_archive" \
            "$VPS_USER@$VPS_HOST:jogo-clube-releases/$GITHUB_SHA.tar.gz"

      - name: Implantar, verificar e reverter em falha
        shell: bash
        run: |
          set -euo pipefail
          ssh_key_path="$RUNNER_TEMP/jogo-clube-vps-key"
          known_hosts_path="$RUNNER_TEMP/jogo-clube-known-hosts"
          release_archive="$RUNNER_TEMP/jogo-clube-$GITHUB_SHA.tar.gz"
          ssh_options=(
            -i "$ssh_key_path"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_path"
          )
          archive_checksum="$(sha256sum "$release_archive" | awk '{print $1}')"
          printf -v remote_command 'bash -s -- %q %q %q' \
            "$GITHUB_SHA" "$PRODUCTION_BASE_URL" "$archive_checksum"

          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          release_sha="$1"
          health_url="$2"
          expected_checksum="$3"
          release_root="$HOME/jogo-clube-releases"
          archive="$release_root/$release_sha.tar.gz"
          release_dir="$release_root/$release_sha"

          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          printf '%s  %s\n' "$expected_checksum" "$archive" | sha256sum -c -
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          test -f "$release_dir/scripts/deploy-vps.sh"
          bash "$release_dir/scripts/deploy-vps.sh" \
            "$release_dir" \
            "$release_sha" \
            '/srv/clubeciencia/.env.production' \
            "$health_url"
          REMOTE

      - name: Smoke público pós-deploy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$PRODUCTION_BASE_URL/health/live"
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$PRODUCTION_BASE_URL/health/ready"

      - name: Registrar resumo
        if: always()
        shell: bash
        run: |
          {
            echo '## Deploy de produção'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $PRODUCTION_BASE_URL"
            echo "- Resultado: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
